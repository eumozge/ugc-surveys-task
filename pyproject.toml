[project]
name = "ugc-surveys"
version = "0.1.0"
description = "UGC survey data-model test assignment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5.0",
    "ruff>=0.12,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
